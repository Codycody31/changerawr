<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changerawr is Starting Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow-x: hidden;
            padding: 1rem;
        }

        .container {
            text-align: center;
            max-width: 1000px;
            width: 100%;
            padding: 3rem;
            animation: fadeIn 1s ease-out;
        }

        .logo {
            font-size: 6rem;
            margin-bottom: 1.5rem;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.5rem;
            margin-bottom: 3rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .loading-container {
            margin: 2rem 0;
        }

        .progress-bar-wrapper {
            position: relative;
            width: 100%;
            height: 8px;
            margin-bottom: 1.5rem;
        }

        .loading-bar,
        .loading-bar-indeterminate {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            border-radius: 3px;
            width: 0%;
            transition: width 0.5s ease-out;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .loading-progress-indeterminate {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            border-radius: 3px;
            width: 30%;
            animation: indeterminate 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(400%);
            }
        }

        .loading-text {
            font-size: 1.1rem;
            opacity: 0.8;
            animation: pulse 2s infinite;
        }

        .status-updates {
            margin-top: 2rem;
            font-size: 1.1rem;
            opacity: 0.7;
            min-height: 1.5rem;
        }

        /* Deployment Stats Section */
        .stats-container {
            margin-top: 3rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .stats-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.75rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .extension-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 1rem;
            text-align: left;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 6px;
        }

        .extension-item {
            font-size: 0.8rem;
            padding: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .extension-item:last-child {
            border-bottom: none;
        }

        .extension-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .extension-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        /* Background animation */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        /* Removed buggy loading animation - using real progress instead */

        @keyframes pulse {
            0%, 100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes dots {
            0%, 24% {
                content: '';
            }
            25%, 49% {
                content: '.';
            }
            50%, 74% {
                content: '..';
            }
            75%, 100% {
                content: '...';
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }

            .logo {
                font-size: 3rem;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="bg-shapes">
    <div class="shape">🦖</div>
    <div class="shape">⚡</div>
    <div class="shape">🚀</div>
</div>

<div class="container">
    <div class="logo">🦖</div>
    <svg width="225" height="50" viewBox="0 0 225 50" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
                <stop offset="0%" stop-color="#186cb8"/>
                <stop offset="19%" stop-color="#186cb8"/>
                <stop offset="20%" stop-color="#2a9a9f"/>
                <stop offset="39%" stop-color="#2a9a9f"/>
                <stop offset="40%" stop-color="#f1b211"/>
                <stop offset="59%" stop-color="#f1b211"/>
                <stop offset="60%" stop-color="#e83611"/>
                <stop offset="79%" stop-color="#e83611"/>
                <stop offset="80%" stop-color="#f9002f"/>
                <stop offset="100%" stop-color="#f9002f"/>
            </linearGradient>
        </defs>
        <text x="0" y="40" font-family="Inter, sans-serif" font-size="36" font-weight="bold" fill="white" letter-spacing="1px" stroke="black" stroke-width="2" paint-order="stroke">
            Change
        </text>
        <text x="138" y="40" font-family="Inter, sans-serif" font-size="36" font-weight="bold" fill="url(#rainbowGradient)" letter-spacing="1px" stroke="black" stroke-width="2" paint-order="stroke">
            rawr
        </text>
    </svg>

    <p class="subtitle">Roaring to life! We're starting up the application.</p>

    <div class="loading-container">
        <div class="progress-bar-wrapper">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="loading-bar-indeterminate">
                <div class="loading-progress-indeterminate"></div>
            </div>
        </div>
        <div class="loading-text">Starting up</div>
    </div>

    <div class="status-updates" id="statusText">
        Application is starting up. This usually takes 10-30 seconds.
    </div>

    <!-- Debug controls (hidden in production) -->
    <div style="margin-top: 2rem; display: none; flex-wrap: wrap; gap: 0.5rem; justify-content: center;">
        <button onclick="triggerExtensionGeneration()" style="padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; cursor: pointer; font-size: 0.85rem;">
            🔧 Extensions
        </button>
        <button onclick="buildWidget()" style="padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; cursor: pointer; font-size: 0.85rem;">
            📦 Widget
        </button>
        <button onclick="buildSwagger()" style="padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; cursor: pointer; font-size: 0.85rem;">
            📚 API Docs
        </button>
        <button onclick="simulateDeployment()" style="padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; cursor: pointer; font-size: 0.85rem;">
            🧪 Full Deploy
        </button>
        <button onclick="resetProgress()" style="padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; cursor: pointer; font-size: 0.85rem;">
            🔄 Reset
        </button>
    </div>
</div>

<script>
    // Same-origin: the maintenance server (and later Next.js) proxy these
    // requests to the internal Extension Builder Service on port 3010.
    const EXTENSION_BUILDER_URL = '';

    let fallbackMode = false;
    let elapsedSeconds = 0;

    // Fetch real-time progress from extension builder service
    const fetchProgress = async () => {
        try {
            const response = await fetch(`${EXTENSION_BUILDER_URL}/startup/progress`, {
                method: 'GET',
                cache: 'no-cache',
            });

            if (response.ok) {
                const data = await response.json();
                fallbackMode = false;

                // Get the latest log message
                const latestLog = data.logs && data.logs.length > 0 ? data.logs[data.logs.length - 1] : null;
                const statusElement = document.getElementById('statusText');
                const loadingElement = document.querySelector('.loading-text');

                // Update loading text with current phase
                if (latestLog) {
                    loadingElement.textContent = latestLog.message;
                }

                // Update status text with elapsed time and warnings
                if (data.complete) {
                    statusElement.textContent = `Application ready! Redirecting... (${data.elapsed}s total)`;
                } else if (data.elapsed < 30) {
                    statusElement.textContent = `${data.progress}% complete • ${data.elapsed}s elapsed`;
                } else if (data.elapsed < 60) {
                    statusElement.textContent = `${data.progress}% complete • ${data.elapsed}s elapsed • Taking longer than usual`;
                } else {
                    statusElement.textContent = `${data.progress}% complete • ${data.elapsed}s elapsed • ⚠️ Unusually slow startup`;
                }

                // Show/hide progress bars based on progress state
                const determinateBar = document.querySelector('.loading-bar');
                const indeterminateBar = document.querySelector('.loading-bar-indeterminate');
                const progressBar = document.querySelector('.loading-progress');

                if (data.progress > 0 && data.progress < 100) {
                    // Show determinate progress bar
                    determinateBar.style.display = 'block';
                    indeterminateBar.style.display = 'none';
                    if (progressBar) {
                        progressBar.style.width = data.progress + '%';
                    }
                } else if (data.progress === 0) {
                    // Show indeterminate progress bar when starting
                    determinateBar.style.display = 'none';
                    indeterminateBar.style.display = 'block';
                } else {
                    // Complete - show full determinate bar
                    determinateBar.style.display = 'block';
                    indeterminateBar.style.display = 'none';
                    if (progressBar) {
                        progressBar.style.width = '100%';
                    }
                }
            } else {
                useFallbackMode();
            }
        } catch (error) {
            // Extension builder not responding, fall back to basic mode
            useFallbackMode();
        }
    };

    // Fallback mode when extension builder isn't available
    function useFallbackMode() {
        if (!fallbackMode) {
            console.log('Extension builder not available, using fallback mode');
            fallbackMode = true;
        }

        const statusElement = document.getElementById('statusText');
        const loadingElement = document.querySelector('.loading-text');
        const determinateBar = document.querySelector('.loading-bar');
        const indeterminateBar = document.querySelector('.loading-bar-indeterminate');

        loadingElement.textContent = 'Starting up';

        // Show indeterminate bar in fallback mode
        determinateBar.style.display = 'none';
        indeterminateBar.style.display = 'block';

        if (elapsedSeconds < 30) {
            statusElement.textContent = `${elapsedSeconds}s elapsed`;
        } else if (elapsedSeconds < 60) {
            statusElement.textContent = `${elapsedSeconds}s elapsed • Taking longer than usual`;
        } else {
            statusElement.textContent = `${elapsedSeconds}s elapsed • ⚠️ Unusually slow startup`;
        }
    }

    // Track elapsed time in fallback mode
    setInterval(() => {
        elapsedSeconds++;
    }, 1000);

    // Trigger extension import generation
    async function triggerExtensionGeneration() {
        try {
            const response = await fetch(`${EXTENSION_BUILDER_URL}/extensions/generate-imports`, {
                method: 'POST',
            });
            if (response.ok) {
                console.log('✓ Extension import generation triggered');
            } else {
                console.error('✗ Failed to trigger generation');
            }
        } catch (error) {
            console.error('✗ Error:', error);
        }
    }

    // Build widget
    async function buildWidget() {
        try {
            const response = await fetch(`${EXTENSION_BUILDER_URL}/build/widget`, {
                method: 'POST',
            });
            if (response.ok) {
                console.log('✓ Widget build triggered');
            } else {
                console.error('✗ Failed to trigger widget build');
            }
        } catch (error) {
            console.error('✗ Error:', error);
        }
    }

    // Generate API documentation
    async function buildSwagger() {
        try {
            const response = await fetch(`${EXTENSION_BUILDER_URL}/build/swagger`, {
                method: 'POST',
            });
            if (response.ok) {
                console.log('✓ API doc generation triggered');
            } else {
                console.error('✗ Failed to trigger API doc generation');
            }
        } catch (error) {
            console.error('✗ Error:', error);
        }
    }

    // Simulate full deployment
    async function simulateDeployment() {
        const steps = [
            { phase: 'maintenance', progress: 5, message: 'Maintenance server started' },
            { phase: 'prisma-generate', progress: 10, message: 'Generating Prisma client' },
            { phase: 'migrations', progress: 25, message: 'Running database migrations' },
            { phase: 'widget', progress: 40, message: 'Building widget components' },
            { phase: 'swagger', progress: 55, message: 'Generating API documentation' },
            { phase: 'extensions', progress: 70, message: 'Generating extension imports' },
            { phase: 'starting-app', progress: 85, message: 'Starting Next.js application' },
            { phase: 'ready', progress: 100, message: 'Application ready' },
        ];

        // Reset first
        await fetch(`${EXTENSION_BUILDER_URL}/startup/reset`, { method: 'POST' });

        for (const step of steps) {
            await fetch(`${EXTENSION_BUILDER_URL}/startup/update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(step),
            });
            await new Promise(resolve => setTimeout(resolve, 2000));
        }

        await fetch(`${EXTENSION_BUILDER_URL}/startup/complete`, { method: 'POST' });
        console.log('✓ Simulated deployment complete');
    }

    // Reset progress
    async function resetProgress() {
        await fetch(`${EXTENSION_BUILDER_URL}/startup/reset`, { method: 'POST' });
        console.log('✓ Progress reset');
    }

    // Check if main app is ready
    const checkAppReady = async () => {
        try {
            const response = await fetch('/api/health', {
                method: 'GET',
                cache: 'no-cache'
            });
            if (response.ok) {
                // App is ready, redirect
                window.location.href = '/';
            }
        } catch (error) {
            // App not ready yet, continue polling
        }
    };

    // Poll for progress every 500ms
    const progressInterval = setInterval(fetchProgress, 500);

    // Check health every 2 seconds
    const healthCheckInterval = setInterval(checkAppReady, 2000);

    // Fallback redirect after 2 minutes (something is wrong)
    setTimeout(() => {
        clearInterval(healthCheckInterval);
        clearInterval(progressInterval);
        document.getElementById('statusText').innerHTML =
            '⚠️ Startup timeout. <a href="/" style="color: white; text-decoration: underline;">Click here to try accessing the app anyway</a>.';
    }, 120000);

    // Start checking immediately
    fetchProgress();
    checkAppReady();
</script>
</body>
</html>
