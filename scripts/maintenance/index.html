<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changerawr is Starting Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000000;
            color: #f5f5f7;
            min-height: 100vh;
        }

        /* Live console output rendered full-bleed behind the content, low-
           contrast so it reads as ambient texture rather than content. Flows
           top-to-bottom like a normal log; JS keeps it scrolled to the latest
           line. */
        .console-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 2rem 3rem;
            pointer-events: none;
            scrollbar-width: none;
        }

        .console-bg::-webkit-scrollbar {
            display: none;
        }

        .console-bg pre {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 0.75rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-all;
            color: #2c2c2e;
        }

        /* Logo sits on its own, vertically centered in the viewport - not
           grouped with the progress UI below. */
        .logo {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            animation: fadeIn 0.6s ease-out;
        }

        .logo svg {
            width: 320px;
            height: auto;
        }

        /* Progress UI lives near the bottom of the screen, separate from the
           logo - mirrors the classic OS boot-screen layout. Hidden until the
           first /startup/steps response comes in. */
        .loading-container {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 8vh;
            z-index: 1;
            text-align: center;
            padding: 0 2rem;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .loading-container.visible {
            opacity: 1;
        }

        .progress-bar-wrapper {
            position: relative;
            width: 240px;
            height: 4px;
            margin: 0 auto 1.5rem;
        }

        .loading-bar {
            width: 100%;
            height: 4px;
            background: #2c2c2e;
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: #f5f5f7;
            border-radius: 2px;
            width: 0%;
            transition: width 0.5s ease-out;
        }

        .loading-text {
            font-size: 1.05rem;
            font-weight: 500;
            color: #f5f5f7;
            padding: 0 1rem;
        }

        .status-updates {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: #6e6e73;
            padding: 0 1rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 640px) {
            .logo svg {
                width: 240px;
            }

            .loading-container {
                bottom: 6vh;
            }
        }
    </style>
</head>
<body>
<div class="console-bg" id="consoleBg">
    <pre id="consoleOutput"></pre>
</div>

<div class="logo">
        <svg width="225" height="50" viewBox="0 0 225 50" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
                    <stop offset="0%" stop-color="#186cb8"/>
                    <stop offset="19%" stop-color="#186cb8"/>
                    <stop offset="20%" stop-color="#2a9a9f"/>
                    <stop offset="39%" stop-color="#2a9a9f"/>
                    <stop offset="40%" stop-color="#f1b211"/>
                    <stop offset="59%" stop-color="#f1b211"/>
                    <stop offset="60%" stop-color="#e83611"/>
                    <stop offset="79%" stop-color="#e83611"/>
                    <stop offset="80%" stop-color="#f9002f"/>
                    <stop offset="100%" stop-color="#f9002f"/>
                </linearGradient>
            </defs>
            <text x="0" y="40" font-family="Inter, sans-serif" font-size="36" font-weight="bold" fill="#f5f5f7" letter-spacing="1px">
                Change
            </text>
            <text x="138" y="40" font-family="Inter, sans-serif" font-size="36" font-weight="bold" fill="url(#rainbowGradient)" letter-spacing="1px">
                rawr
            </text>
        </svg>
</div>

<div class="loading-container" id="loadingContainer">
    <div class="progress-bar-wrapper">
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
    </div>
    <div class="loading-text" id="currentStepText"></div>
    <div class="status-updates" id="statusText"></div>
</div>

<script>
    // Progress is polled from the maintenance server
    // (scripts/maintenance/server.js), which derives a percent/ETA from the
    // plain-text step log docker-entrypoint.sh writes to.

    // If the currently-running step hasn't changed for a long time, append a
    // reassurance note. Some steps (extension-aware rebuild) can legitimately
    // take up to 30 minutes.
    const STUCK_WARNING_MS = 10 * 60 * 1000; // 10 minutes

    const formatEta = (seconds) => {
        if (!seconds || seconds <= 0) return '';
        if (seconds < 45) return 'About a minute remaining';
        const minutes = Math.round(seconds / 60);
        return `About ${minutes} minute${minutes === 1 ? '' : 's'} remaining`;
    };

    const renderProgress = (data) => {
        const loadingContainer = document.getElementById('loadingContainer');
        const statusElement = document.getElementById('statusText');
        const determinateBar = document.getElementById('loadingProgress');
        const currentStepElement = document.getElementById('currentStepText');

        // Stay hidden until there's real progress to show - just the logo on
        // black at first, like a classic OS boot screen.
        if (data.percent > 0 || data.complete) {
            loadingContainer.classList.add('visible');
        }

        currentStepElement.textContent = data.complete
            ? 'Application ready!'
            : (data.currentStep ? data.currentStep.message : 'Starting up');

        determinateBar.style.width = `${data.percent}%`;

        const eta = !data.complete ? formatEta(data.etaSeconds) : '';
        const etaSuffix = eta ? ` • ${eta}` : '';

        // The extension-aware rebuild step can legitimately run for up to 30
        // minutes, so the elapsed-time-based "taking longer than usual" /
        // "unusually slow" messaging below doesn't apply while it's running.
        const isRebuilding = data.currentStep && data.currentStep.id === 'rebuild';

        if (data.complete) {
            statusElement.textContent = `Application ready! Redirecting... (${data.elapsed}s total)`;
        } else if (isRebuilding || data.elapsed < 30) {
            statusElement.textContent = `${data.percent}% complete • ${data.elapsed}s elapsed${etaSuffix}`;
        } else if (data.elapsed < 60) {
            statusElement.textContent = `${data.percent}% complete • ${data.elapsed}s elapsed${etaSuffix} • Taking longer than usual`;
        } else {
            statusElement.textContent = `${data.percent}% complete • ${data.elapsed}s elapsed${etaSuffix} • Unusually slow startup`;
        }

        // Append a note if the currently-running step has been running for a
        // long time. Skipped during the extension rebuild, which can
        // legitimately take up to 30 minutes on its own.
        const runningStep = data.steps.find((step) => step.state === 'running');
        const runningFor = runningStep && runningStep.timestamp ? Date.now() - runningStep.timestamp : 0;
        if (!data.complete && !isRebuilding && runningFor > STUCK_WARNING_MS) {
            statusElement.textContent += ' • This is taking longer than expected';
        }
    };

    const fetchProgress = async () => {
        try {
            const response = await fetch('/startup/steps', {
                method: 'GET',
                cache: 'no-cache',
            });
            if (!response.ok) return;
            renderProgress(await response.json());
        } catch (error) {
            // The maintenance server is killed once setup finishes (right
            // before Next.js starts) - this poll will start failing then.
            // checkAppReady() below takes over from here.
        }
    };

    // Fetch raw console output captured by docker-entrypoint.sh and render
    // it as the page background. Only the tail is kept on screen - the
    // flex/overflow setup on .console-bg clips older lines off the top.
    const fetchConsoleLogs = async () => {
        try {
            const response = await fetch('/startup/logs', {
                method: 'GET',
                cache: 'no-cache',
            });

            if (!response.ok) return;

            const data = await response.json();
            if (!data.available) return;

            document.getElementById('consoleOutput').textContent = data.log || '';

            // Keep the latest line in view - the text itself stays in
            // chronological (top-to-bottom) order.
            const consoleBg = document.getElementById('consoleBg');
            consoleBg.scrollTop = consoleBg.scrollHeight;
        } catch (error) {
            // Skip this poll
        }
    };

    // Check if main app is ready
    const checkAppReady = async () => {
        try {
            const response = await fetch('/api/health', {
                method: 'GET',
                cache: 'no-cache'
            });
            if (response.ok) {
                window.location.href = '/';
            }
        } catch (error) {
            // App not ready yet, continue polling
        }
    };

    // Poll step progress every second
    setInterval(fetchProgress, 1000);

    // Poll for raw console output every 2 seconds
    setInterval(fetchConsoleLogs, 2000);

    // Check health every 2 seconds
    setInterval(checkAppReady, 2000);

    // Start checking immediately
    fetchProgress();
    fetchConsoleLogs();
    checkAppReady();
</script>
</body>
</html>
